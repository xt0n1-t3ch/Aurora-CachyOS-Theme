# File Explorer's whole-disk search (aurora-search). Lines are key = value; # starts a comment. See docs/search.md.
#
# Minutes the helper stays after the last File Explorer window let go of it (default 5).
# idle_minutes = 5
#
# A folder never to index, one line each. /proc, /sys, /dev, /run, /tmp, /var/tmp and snapshots are never indexed.
# exclude = /srv/backups
