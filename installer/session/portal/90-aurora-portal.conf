# Aurora: apps ask xdg-desktop-portal for their Open and Save panels, which File Explorer draws
# (aurora.portal). Qt and KDE apps through Plasma's integration, GTK 3 apps and Firefox/Thunderbird through
# GTK_USE_PORTAL; GTK 4, Chromium, Edge and Electron use the portal on their own.
PLASMA_INTEGRATION_USE_PORTAL=1
GTK_USE_PORTAL=1
