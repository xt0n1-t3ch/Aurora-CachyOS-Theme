# Aurora: Open and Save panels come from File Explorer (aurora.portal); KDE's stays as the fallback.
# The rest matches /usr/share/xdg-desktop-portal/kde-portals.conf, which this file replaces.
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify
org.freedesktop.impl.portal.FileChooser=aurora;kde
