# Aurora: plasmashell loads org.aurora.glass (per-module blur for the Control Center) from the user's
# QML modules. The session env script exports the same path for sessions started without systemd.
[Service]
Environment=QML_IMPORT_PATH=%h/.local/lib/qt6/qml
