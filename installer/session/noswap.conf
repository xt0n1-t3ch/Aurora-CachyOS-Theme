# Aurora: the compositor and the shell stay in RAM. With zram and vm.swappiness=150 the kernel swapped
# out idle parts of KWin and Xwayland (795 MB in one measurement); each switch between apps then faulted them back
# in and the pointer and animations stuttered. memory.swap.max=0 keeps their memory out of swap. See
# docs/performance.md.
[Service]
MemorySwapMax=0
