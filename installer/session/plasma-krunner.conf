# Aurora: KRunner opens as macOS Tahoe's Spotlight (components/quick-menu in the theme's checkout). The
# launcher starts the stock /usr/bin/krunner whenever Quick Menu was built for another Plasma or Qt; deleting this
# file and running `systemctl --user daemon-reload` brings the stock KRunner back for good.
[Service]
ExecStart=
ExecStart=%h/.local/lib/aurora/quick-menu/krunner-launch --daemon
# Quick Menu's blur comes from org.aurora.glass in the user's Qt 6 tree (the Control Center's module).
Environment=QML_IMPORT_PATH=%h/.local/lib/qt6/qml
