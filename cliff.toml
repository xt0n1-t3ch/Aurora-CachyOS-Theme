# git-cliff (https://git-cliff.org, `pacman -S git-cliff`): a first draft of [Unreleased] from Conventional Commits.
#   git-cliff --unreleased --strip all
# CHANGELOG.md stays written by people: read the draft, keep what a user would notice, word it for them
# (docs/releasing.md).

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^deprecat", group = "Deprecated" },
  { message = "^revert", group = "Removed" },
  { message = "^security", group = "Security" },
  { message = "^(docs|style|refactor|test|build|ci|chore)", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
