# pacman's configuration for the clean chroot that builds Aurora's package (scripts/clean-build.sh): Arch Linux's own
# core and extra, the packages built for every x86-64 processor. It follows devtools' extra.conf
# (/usr/share/devtools/pacman.conf.d/extra.conf) but names the architecture: CachyOS's pacman reads `auto` as
# x86_64, x86_64_v2 and x86_64_v3 on a newer processor, and would take packages built for it.

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
NoProgressBar
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
