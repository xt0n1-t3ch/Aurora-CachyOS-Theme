[package]
name = "aurora-search"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "File Explorer's whole-disk name search: an index kept by the kernel's change records, started only when asked"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
libc = "0.2"

[lints.rust]
# The kernel interfaces (ioctl, fanotify, statx) are reached through `libc`; each unsafe block says why it is sound.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
