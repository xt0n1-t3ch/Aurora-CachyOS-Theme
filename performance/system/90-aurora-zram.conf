# Aurora: lz4 instead of CachyOS's zstd for the zram swap. On a Ryzen 7 5800X with the same 64 KiB blocks, lz4
# decompresses at 3.7 GB/s against 1.3 and compresses at 717 MB/s against 347: the time an app waits when it touches
# swapped memory. The price is a lower ratio (1.9 against 2.5). The method and the cost in RAM are in
# docs/performance.md, Memory. The rest of CachyOS's zram setup stays as it ships.
[zram0]
compression-algorithm = lz4
