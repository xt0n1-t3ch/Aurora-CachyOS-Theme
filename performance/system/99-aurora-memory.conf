# Aurora: kswapd keeps about 1.25 % of RAM free ahead of demand, so apps rarely have to stall and reclaim memory
# themselves. The kernel docs (Documentation/admin-guide/sysctl/vm.rst) give two signs for raising it, direct-reclaim
# stalls (allocstall) and early kswapd sleeps (kswapd_low_wmark_hit_quickly); the counts measured before the change
# are in docs/performance.md, Memory. Pop!_OS and the ArchWiki zram page use the same value.
vm.watermark_scale_factor = 125
